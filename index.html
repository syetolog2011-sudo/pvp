<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP Рулетка Pchelmed</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div id="balance-container">
            Твой баланс: <span id="user-balance">Загрузка...</span> 🍯
        </div>

        <h2>PvP Рулетка</h2>
        
        <h3 id="timer-text">Ожидание сервера...</h3>
        
        <div class="pointer"></div>
        
        <div class="wheel-outer">
            <div class="wheel" id="wheel"></div>
        </div>

        <div class="bet-input-container">
            <input type="number" id="bet-amount-input" value="100" min="10" placeholder="Ваша ставка">
        </div>

        <button id="spin-btn" class="btn" disabled>Загрузка...</button>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
