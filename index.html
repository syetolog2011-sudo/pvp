<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP Рулетка Pchelmed</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h2>PvP Рулетка</h2>
        
        <div class="pointer"></div>
        
        <div class="wheel-outer">
            <div class="wheel" id="wheel"></div>
        </div>

        <div class="stats">
            <p>Ваша ставка (Игрок 1): <span id="p1-bet">500</span> 🪙 (Шанс: <span id="p1-chance">0</span>%)</p>
            <p>Соперник (Игрок 2): <span id="p2-bet">250</span> 🪙 (Шанс: <span id="p2-chance">0</span>%)</p>
        </div>

        <button id="spin-btn" class="btn">Тест Прокрутки</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
